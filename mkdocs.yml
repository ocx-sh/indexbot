# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: indexbot
site_description: Write path for an OCX package index.
site_url: https://ocx-sh.github.io/indexbot/
site_author: The OCX Authors
repo_name: ocx-sh/indexbot
repo_url: https://github.com/ocx-sh/indexbot
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 The OCX Authors

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ocx-sh/indexbot
    - icon: fontawesome/solid/globe
      link: https://ocx.sh

# No mkdocstrings: this package is a CLI, not an importable API. The reference
# section documents subcommands and their exit codes, not module members.
plugins:
  - search
  - include-markdown
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      hide_protocol: true
      repo_url_shorthand: true
      user: ocx-sh
      repo: indexbot
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Guide:
      - Quickstart: guide/quickstart.md
  - Reference:
      - CLI: reference/cli.md
      - Deployment policy: reference/policy.md
      - Workflow invariants: reference/workflow-invariants.md
      - Module contracts: reference/contracts.md
  - Contributing:
      - Releasing: contributing/releasing.md
  - Changelog: changelog.md
