[project]
name = "ocx-indexbot"
version = "0.1.0"
description = "Write path for an OCX package index — announce, reconcile, validate, render."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "The OCX Authors" }]
keywords = ["ocx", "oci", "registry", "package-index", "sparse-index", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    # PY-PKG-02: every version here is a leg of ci.yml's `unit-matrix`.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ocx-sh/indexbot"
Repository = "https://github.com/ocx-sh/indexbot"
Issues = "https://github.com/ocx-sh/indexbot/issues"
Documentation = "https://ocx-sh.github.io/indexbot/"
Changelog = "https://github.com/ocx-sh/indexbot/blob/main/CHANGELOG.md"
"OCX Project" = "https://github.com/ocx-sh/ocx"
"OCX Public Index" = "https://github.com/ocx-sh/index"

[project.scripts]
indexbot = "ocx_indexbot.cli.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocx_indexbot"]

# PEP 735 groups, never `[project.optional-dependencies]` (PY-PKG-07): an extra
# is installable by a consumer, so a `dev` extra offers the world this test
# stack.
[dependency-groups]
dev = [
    "bandit>=1.7",
    "check-jsonschema>=0.29",
    "coverage[toml]>=7.6",
    "hypothesis>=6.112",
    "mutmut>=3.2",
    "pip-audit>=2.7",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
]
docs = [
    "mkdocs-material>=9.5,<10",
    "mkdocs-include-markdown-plugin>=7",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "pymdown-extensions>=10.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PGH denies bare `# noqa` / `# type: ignore` (PY-GATE-08) — a suppression
# always names its code.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S", "ANN", "PGH"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test suite (S101); fixtures like FakeGitHub's
# next-PR-number counter are private-by-convention, not a lint violation.
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--cov=ocx_indexbot --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
# ponytail: no explicit `core` override. sys.monitoring (PEP 669) branch
# coverage needs Python 3.14+ (coverage.py's own env.py gate); on the 3.12
# floor, requesting core="sysmon" just prints a CoverageWarning and silently
# falls back to the classic trace core anyway — verified empirically
# (coverage 7.15.2). Revisit if the floor ever moves to 3.14 (ADR-4 BD-1/BD-3).
source = ["src"]
relative_files = true

[tool.coverage.report]
# A design constraint (ADR-4 BD-3), not a target — never lowered.
fail_under = 100
show_missing = true
exclude_also = [
    'if TYPE_CHECKING:',
    'if __name__ == "__main__":',
    '^\s*\.\.\.$',
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mutmut]
paths_to_mutate = "src/ocx_indexbot/"
tests_dir = "tests/"
runner = "python -m pytest -x -q"
